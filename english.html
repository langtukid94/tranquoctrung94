nt so soon. I wanted to surprise everyone.","Lẽ ra em không nên tiết lộ việc em có mang quá sớm. Anh muốn làm mọi người ngạc nhiên.",6],["Do you have any allergies?","Ông có bị dị ứng nào không?",6],["David thinks he's so important. He always looks down on the other people in his office.","David cho rằng anh ta rất quan trọng. Anh ta đã luôn coi thường những người khác trong văn phòng của anh ta.",6],["Melissa completely lost her head when the house caught on fire. She didn't know what to do.","Melissa hoàn toàn mất bình tĩnh khi ngôi nhà phát hỏa. Cô ấy không biết nên làm gì.",6],["Except that here, it's not so simple.","Nhưng ở đây, không dễ dàng như vậy đâu.",6],["It makes no difference what you say. I'm still going to buy that expensive car.","Những điều anh nói không quan trọng. Tôi sẽ vẫn mua chiếc xe hơi đắt tiền đó.",6],["We'll have to make room for your mother when she moves into our house with us.","Chúng ta sẽ phải để dành chỗ cho mẹ bạn khi bà ấy dọn vào ở nhà chúng ta.",6],["This corporation is well known for its communication equipment.","Tập đoàn này nổi tiếng vì trang thiết bị thông tin của nó.",6],["Wow, Daniel has put on a lot of weight since the last time I saw him.","Chà, Daniel đã tăng cân rất nhiều kể từ lần sau cùng tôi gặp anh ấy.",6],["Chris, you're completely wet!","Chris, bạn bị ướt hết rồi kìa!",6],["I'm sorry I can't join you today. I have to run a lot of errands before this evening.","Tôi rất tiếc, hôm nay tôi không thể tham gia với bạn. Trước buổi tối nay tôi phải chạy rất nhiều việc vặt.",6],["I'm sorry to have caused you so much trouble.","Tôi xin lỗi vì đã gây ra nhiều rắc rối cho bạn.",6],["Sweetheart, we need to go to the supermarket. We ran out of milk.","Em yêu, chúng ta cần đi đến siêu thị. Chúng ta hết sữa rồi.",6],["It serves you right that you failed your exam. You didn't study for it at all.","Bạn thi rớt là đáng đời. Bạn đã không học thi gì cả.",6],["Please don't spill the beans to Elizabeth that I bought her a gold necklace for her birthday.","Xin đừng tiết lộ với Elizabeth là tôi đã mua cho cô ấy sợi dây chuyền vàng tặng sinh nhật của cô ấy nhé.",6],["You must stand up for what you believe in or no one will respect you.","Anh phải bảo vệ những gì anh tin tưởng nếu không sẽ không có ai tôn trọng anh.",6],["It's difficult to tell those two twins apart because they look so much alike.","Thật khó phân biệt được hai chị em song sinh đó vì họ trông rất giống nhau.",6],["This is our friend Tom.","Đây là bạn của bọn tớ, Tom",6],["At the seminar, they threw us all together into groups and made us talk together.","Tại cuộc hội thảo, họ đã tụ họp chúng tôi thành các nhóm và bắt chúng tôi nói chuyện với nhau.",6],["Salt is an indispensable ingredient for cooking.","Muối là nguyên liệu nhất thiết phải có để nấu nướng.",6],["Don't waste your breath with Fred. He'll never change his mind.","Đừng phí thời gian nói chuyện với Fred. Anh ta sẽ không bao giờ đổi ý đâu.",6],["Stop beating around the bush and tell me directly why you're so angry.","Thôi đừng quanh co nữa, hãy nói thẳng cho tôi biết tại sao anh tức giận như vậy.",6],["And so each citizen plays an indispensable role.","Và như vậy mọi công dân đều có vai trò không thể thiếu được.",6],["Billy, get lost! I don't want to see you here again.","Billy, hãy cút đi! Tôi không muốn nhìn thấy anh ở đây nữa.",6],["Do you know each other?","Tui bây có biết nhau không?",6],["Did you hear that the position for manager is up for grabs?","Bạn có nghe nói vị trí trưởng phòng còn trống không?",6],["He exchanged his old car for a new one.","Anh ta đổi chiếc xe cũ của mình với một chiếc mới.",6],["Everyone is happy with the decision, so please don't rock the boat.","Mọi người đều hài lòng về quyết định này, nên xin đừng làm gì xáo trộn tình hình.",6],["We're really behind schedule. We need to get on the ball.","Chúng ta thực sự chậm trễ so với kế hoạch rồi. Chúng ta cần phải khẩn trương lên.",6],["William is so organized. He's always on top of things.","Willi
